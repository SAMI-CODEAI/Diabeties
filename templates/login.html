{% extends "layout.html" %}
{% block body %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3>Login</h3>
    <form method="post">
      <div class="mb-3">
        <label>Email</label>
        <input class="form-control" name="email" required placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label>Password</label>
        <input class="form-control" name="password" type="password" required>
      </div>
      <button class="btn btn-primary">Login</button>
      <a href="{{ url_for('register') }}" class="btn btn-link">Register</a>
    </form>
  </div>
</div>
{% endblock %}
